name: Crypta continuation candidate
on:
  workflow_dispatch:
  push:
    branches: [crypta/runtime-continuation-v11.3]
    paths-ignore:
      - .github/workflows/crypta-continuation-proof.yml
      - .github/workflows/crypta-continuation-package-repair.yml
permissions:
  contents: read
concurrency:
  group: crypta-continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          semantic-checks: "true"
      - name: Changed-file format
        shell: bash
        run: |
          git fetch --depth=1 origin 847611dcaa3bf0e2783335f961dd1fd0580e4d9f
          mapfile -t changed < <(git diff --name-only 847611dcaa3bf0e2783335f961dd1fd0580e4d9f HEAD)
          pnpm exec oxfmt --check "${changed[@]}"
      - name: Build runtime for early native canary
        run: node --import ./scripts/tsx.mjs scripts/build-all.mts runtime
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Pack candidate Codex plugin
        run: bash scripts/plugin-npm-publish.sh --pack extensions/codex
        env:
          OPENCLAW_PLUGIN_NPM_PACK_OUTPUT_DIR: ${{ runner.temp }}
      - name: Native Gateway continuation canary
        run: >-
          node scripts/run-vitest.mjs --config test/vitest/vitest.e2e.config.ts
          test/e2e/qa-lab/runtime/gateway-technical-continuation.product-proof.e2e.test.ts
          --maxWorkers=1
        env:
          OPENCLAW_E2E_VERBOSE: "1"
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          CRYPTA_CANARY_CODEX_TARBALL: ${{ runner.temp }}/openclaw-codex-2026.11.3.tgz
      - name: Targeted behavioral proofs
        run: >-
          node scripts/run-vitest.mjs
          extensions/codex/src/technical-continuation.test.ts
          extensions/codex/src/technical-continuation.namespace.test.ts
          extensions/codex/src/technical-continuation.lite.test.ts
          extensions/codex/src/technical-continuation.http.test.ts
          extensions/codex/src/technical-continuation.store.test.ts
          extensions/codex/src/app-server/config.test.ts
          src/agents/embedded-agent-runner/result-fallback-classifier.test.ts
          src/agents/harness/host-model-request.test.ts
          src/agents/harness/host-capability.source-lifetime.test.ts
          src/auto-reply/reply/agent-runner-execution-command-events.test.ts
          extensions/codex/src/app-server/native-subagent-monitor.parent-retention.test.ts
          extensions/codex/src/app-server/inference-proxy.http.test.ts
          extensions/codex/src/app-server/inference-routing.test.ts
          --maxWorkers=2
      - name: Core and extension types
        run: pnpm tsgo:core && pnpm tsgo:extensions
      - name: Build candidate package
        run: pnpm build:package
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Verify final package Gateway continuation
        run: >-
          node scripts/run-vitest.mjs --config test/vitest/vitest.e2e.config.ts
          test/e2e/qa-lab/runtime/gateway-technical-continuation.product-proof.e2e.test.ts
          --maxWorkers=1
        env:
          OPENCLAW_E2E_VERBOSE: "1"
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          CRYPTA_CANARY_CODEX_TARBALL: ${{ runner.temp }}/openclaw-codex-2026.11.3.tgz
      - name: Pack canonical self-contained candidate
        run: |
          node scripts/package-openclaw-for-docker.mjs --skip-build --allow-unreleased-changelog --output-dir "$RUNNER_TEMP/core-package"
          mv "$RUNNER_TEMP/core-package/openclaw-2026.11.3.tgz" "$RUNNER_TEMP/openclaw-2026.11.3.tgz"
      - name: Verify packed installation and public SDK
        run: |
          mkdir -p "$RUNNER_TEMP/installed-candidate"
          printf '{"name":"crypta-package-install-proof","private":true}' > "$RUNNER_TEMP/installed-candidate/package.json"
          npm install --prefix "$RUNNER_TEMP/installed-candidate" --no-audit --no-fund --omit=dev "$RUNNER_TEMP/openclaw-2026.11.3.tgz"
          node "$RUNNER_TEMP/installed-candidate/node_modules/openclaw/dist/index.js" --version
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          const sdk = await import(pathToFileURL(path.join(process.env.RUNNER_TEMP, 'installed-candidate/node_modules/openclaw/dist/plugin-sdk/gateway-runtime.js')));
          assert.equal(typeof sdk.GatewayClient, 'function');
          console.log('Installed candidate CLI and public Gateway SDK passed.');
          NODE
      - name: Record package identity and hashes
        run: |
          python3 <<'PYTHON'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          (root / 'candidate-source.json').write_text(json.dumps({'sourceHead': source, 'originalBuildRun': int(os.environ.get('CRYPTA_ORIGINAL_BUILD_RUN', os.environ['GITHUB_RUN_ID'])), 'packagingWorkflowHead': os.environ['GITHUB_SHA'], 'packagingRun': int(os.environ['GITHUB_RUN_ID']), 'kind': 'canonical-self-contained'}))
          PYTHON
          sha256sum "$RUNNER_TEMP"/openclaw-*.tgz > "$RUNNER_TEMP/candidate.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crypta-continuation-candidate
          path: |
            ${{ runner.temp }}/openclaw-*.tgz
            ${{ runner.temp }}/candidate.sha256
            ${{ runner.temp }}/candidate-source.json
          retention-days: 3
