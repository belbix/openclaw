name: Crypta continuation candidate
on:
  workflow_dispatch:
  push:
    branches: [crypta/runtime-continuation-v11.3]
permissions:
  contents: read
concurrency:
  group: crypta-continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"
          semantic-checks: "true"
      - name: Changed-file format
        shell: bash
        run: |
          git fetch --depth=1 origin 847611dcaa3bf0e2783335f961dd1fd0580e4d9f
          mapfile -t changed < <(git diff --name-only 847611dcaa3bf0e2783335f961dd1fd0580e4d9f HEAD)
          pnpm exec oxfmt --check "${changed[@]}"
      - name: Build runtime for early native canary
        run: node --import ./scripts/tsx.mjs scripts/build-all.mts runtime
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Pack candidate Codex plugin
        run: bash scripts/plugin-npm-publish.sh --pack extensions/codex
        env:
          OPENCLAW_PLUGIN_NPM_PACK_OUTPUT_DIR: ${{ runner.temp }}
      - name: Native Gateway continuation canary
        run: >-
          node scripts/run-vitest.mjs --config test/vitest/vitest.e2e.config.ts
          test/e2e/qa-lab/runtime/gateway-technical-continuation.product-proof.e2e.test.ts
          --maxWorkers=1
        env:
          OPENCLAW_E2E_VERBOSE: "1"
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          CRYPTA_CANARY_CODEX_TARBALL: ${{ runner.temp }}/openclaw-codex-2026.11.3.tgz
      - name: Targeted behavioral proofs
        run: >-
          node scripts/run-vitest.mjs
          extensions/codex/src/technical-continuation.test.ts
          extensions/codex/src/technical-continuation.namespace.test.ts
          extensions/codex/src/technical-continuation.http.test.ts
          extensions/codex/src/technical-continuation.store.test.ts
          extensions/codex/src/app-server/config.test.ts
          src/agents/embedded-agent-runner/result-fallback-classifier.test.ts
          src/agents/harness/host-model-request.test.ts
          src/agents/harness/host-capability.source-lifetime.test.ts
          src/auto-reply/reply/agent-runner-execution-command-events.test.ts
          extensions/codex/src/app-server/native-subagent-monitor.parent-retention.test.ts
          extensions/codex/src/app-server/inference-proxy.http.test.ts
          extensions/codex/src/app-server/inference-routing.test.ts
          --maxWorkers=2
      - name: Core and extension types
        run: pnpm tsgo:core && pnpm tsgo:extensions
      - name: Build candidate package
        run: pnpm build:package
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Verify final package Gateway continuation
        run: >-
          node scripts/run-vitest.mjs --config test/vitest/vitest.e2e.config.ts
          test/e2e/qa-lab/runtime/gateway-technical-continuation.product-proof.e2e.test.ts
          --maxWorkers=1
        env:
          OPENCLAW_E2E_VERBOSE: "1"
          OPENCLAW_E2E_USE_PREBUILT_DIST: "1"
          CRYPTA_CANARY_CODEX_TARBALL: ${{ runner.temp }}/openclaw-codex-2026.11.3.tgz
      - name: Pack immutable candidate
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          sha256sum "$RUNNER_TEMP"/openclaw-*.tgz > "$RUNNER_TEMP/candidate.sha256"
      - name: Deliver verified candidate through task-scoped HTTPS
        id: direct_delivery
        continue-on-error: true
        env:
          CANDIDATE_UPLOAD_URL: ${{ secrets.CRYPTA_CANDIDATE_UPLOAD_URL }}
          CANDIDATE_UPLOAD_TOKEN: ${{ secrets.CRYPTA_CANDIDATE_UPLOAD_TOKEN }}
        run: |
          python3 <<'PYTHON'
          import hashlib, json, os, pathlib, time, urllib.request
          base = os.environ['CANDIDATE_UPLOAD_URL'].rstrip('/')
          token = os.environ['CANDIDATE_UPLOAD_TOKEN']
          assert base.startswith('https://') and token, 'Task delivery is not configured'
          run = os.environ['GITHUB_RUN_ID']
          head = os.environ['GITHUB_SHA']
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          def put(name, index, data):
              digest = hashlib.sha256(data).hexdigest()
              url = f'{base}/candidate/{run}/{head}/{name}/{index:06d}'
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, data=data, method='PUT', headers={'X-Crypta-Upload-Token': token, 'X-Content-SHA256': digest, 'Content-Type': 'application/octet-stream'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          receipt = json.load(response)
                      assert receipt == {'sha256': digest, 'bytes': len(data)}
                      return
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)
          files = []
          for name in ['openclaw-2026.11.3.tgz', 'openclaw-codex-2026.11.3.tgz', 'candidate.sha256']:
              file = root / name
              digest = hashlib.sha256()
              count = 0
              with file.open('rb') as stream:
                  while chunk := stream.read(512 * 1024):
                      digest.update(chunk)
                      put(name, count, chunk)
                      count += 1
              files.append({'name': name, 'bytes': file.stat().st_size, 'sha256': digest.hexdigest(), 'parts': count})
              print(json.dumps(files[-1]), flush=True)
          put('delivery.json', 0, json.dumps({'run': int(run), 'head': head, 'files': files}).encode())
          print('All candidate bytes acknowledged by the authenticated task receiver.')
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: github_delivery
        if: steps.direct_delivery.outcome != 'success'
        continue-on-error: true
        with:
          name: crypta-continuation-candidate
          path: |
            ${{ runner.temp }}/openclaw-*.tgz
            ${{ runner.temp }}/candidate.sha256
          retention-days: 3
      - name: Require verified candidate delivery
        if: always()
        env:
          DIRECT_DELIVERY: ${{ steps.direct_delivery.outcome }}
          GITHUB_DELIVERY: ${{ steps.github_delivery.outcome }}
        run: |
          test "$DIRECT_DELIVERY" = success || test "$GITHUB_DELIVERY" = success
